<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>产业链报告目录</title>
  <style>
    :root {
      --bg: #f6f8fb;
      --panel: #ffffff;
      --ink: #17212c;
      --muted: #5d6876;
      --line: #dbe3ee;
      --blue: #1f5f99;
      --green: #168567;
      --orange: #b65c17;
      --shadow: 0 12px 28px rgba(37, 47, 64, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", Arial, sans-serif;
      line-height: 1.6;
    }

    .page {
      width: min(1120px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 42px 0 72px;
    }

    header {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: linear-gradient(110deg, rgba(31, 95, 153, 0.10), rgba(22, 133, 103, 0.08)), var(--panel);
      box-shadow: var(--shadow);
      padding: 32px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(30px, 4vw, 48px);
      line-height: 1.14;
      letter-spacing: 0;
    }

    p { margin: 0; color: var(--muted); }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
      margin-top: 22px;
    }

    .card {
      display: flex;
      min-height: 220px;
      flex-direction: column;
      gap: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
      padding: 20px;
      text-decoration: none;
      color: inherit;
    }

    .card:hover {
      border-color: #abc6e4;
      text-decoration: none;
    }

    .tag {
      align-self: flex-start;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 4px 9px;
      font-size: 12px;
      font-weight: 700;
      color: var(--blue);
      background: #e8f1fb;
    }

    .tag.green { color: var(--green); background: #e6f5ef; }
    .tag.orange { color: var(--orange); background: #fff0df; }

    h2 {
      margin: 0;
      font-size: 21px;
      line-height: 1.3;
      letter-spacing: 0;
    }

    .meta {
      margin-top: auto;
      color: var(--muted);
      font-size: 13px;
    }

    .back {
      display: inline-flex;
      margin-top: 24px;
      color: var(--blue);
      font-weight: 700;
      text-decoration: none;
    }

    @media (max-width: 860px) {
      .grid { grid-template-columns: 1fr; }
      header { padding: 24px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <h1>产业链报告目录</h1>
      <p>按主题分开存放，便于独立访问、维护和后续扩展。</p>
    </header>

    <section class="grid" aria-label="报告列表">
      <a class="card" href="memory_chip_industry_chain/">
        <span class="tag">新增报告</span>
        <h2>存储芯片产业链</h2>
        <p>覆盖类别、全流程、设备、A股映射、CAGR、下游结构、产能约束、扩产与涨价信息。</p>
        <div class="meta">路径：reports/memory_chip_industry_chain/</div>
      </a>

      <a class="card" href="../molybdenum-industry-chain/">
        <span class="tag orange">独立旧报告</span>
        <h2>钼产业链</h2>
        <p>保持与存储芯片报告分开，沿用原有独立目录。</p>
        <div class="meta">路径：molybdenum-industry-chain/</div>
      </a>

      <a class="card" href="../">
        <span class="tag green">首页报告</span>
        <h2>制冷剂产业链</h2>
        <p>仓库首页保留制冷剂产业链长图和PDF下载入口。</p>
        <div class="meta">路径：/</div>
      </a>
    </section>

    <a class="back" href="../">返回仓库首页</a>
  </main>
</body>
</html>
